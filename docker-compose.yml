services:
  api:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      AUTORESEARCH_STORE_BACKEND: ${AUTORESEARCH_STORE_BACKEND:-json}
      AUTORESEARCH_DATA_PATH: /app/data/autoresearch_store.json
      AUTORESEARCH_API_PREFIX: ${AUTORESEARCH_API_PREFIX:-/api/v1}
      AUTORESEARCH_CORS_ORIGINS: ${AUTORESEARCH_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}
      AUTORESEARCH_DATABASE_URL: ${AUTORESEARCH_DATABASE_URL:-postgresql://autoresearch:autoresearch@postgres:5432/autoresearch}
    command: sh -lc 'if [ "$$AUTORESEARCH_STORE_BACKEND" = "postgres" ]; then uv run alembic upgrade head; fi && uv run python -m uvicorn autoresearch_platform.main:app --host 0.0.0.0 --port 8010'
    ports:
      - "8010:8010"
    depends_on:
      - postgres

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - .:/app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8010}
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoresearch
      POSTGRES_USER: autoresearch
      POSTGRES_PASSWORD: autoresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
