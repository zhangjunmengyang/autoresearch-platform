[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-platform"
version = "0.1.0"
description = "REST/OpenAPI fact source and workbench for external AutoResearch runtimes"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25.0",
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["autoresearch_platform"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
